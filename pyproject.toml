[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kellogg-llm-batch"
version = "0.1.0"
description = "Reliable, reproducible LLM batch pipelines for research coding and extraction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "anthropic>=0.49",
  "jsonschema>=4.20",
  "openai>=1.68",
  "pandas>=2.0",
  "pyarrow>=14",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.0",
  "streamlit>=1.50,<2",
  "typer>=0.12",
]

[project.optional-dependencies]
gui = []
dev = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[project.scripts]
kllm-batch = "kellogg_llm_batch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["scale: opt-in large synthetic acceptance test"]
