version: 1

project:
  name: grant-topic-coding-multisegment-retry
  description: Exercise retry and merge with three controlled missing outputs across five batch segments.

input:
  path: data/input-data.csv
  format: csv
  id_column: grant_id
  csv_encoding: utf-8
  fields_sent:
    project_title: project_title
    abstract: abstract
    retry_case: retry_case
    retry_trigger_id: retry_trigger_id
  columns_preserved:
    - year
    - investigator
    - source_file
  required_fields:
    - abstract
    - retry_case
  missing_required: error
  field_limits:
    abstract:
      overflow: error

task:
  rows_per_request: 3
  output_schema: schema.json
  max_input_tokens: 50000
  max_output_tokens: 1200

prompt:
  version: "1.0-retry-smoke-test"
  system_file: prompts/system.txt
  user_file: prompts/user.txt
  context:
    codebook:
      path: context/codebook.csv
      format: csv

providers:
  openai:
    model: gpt-5.4-mini
    max_requests_per_batch: 2
    options:
      reasoning:
        effort: low
  anthropic:
    model: claude-haiku-4-5
    max_requests_per_batch: 2

budget:
  max_estimated_usd: 5.0

evaluation:
  random_seed: 42
  gold_columns:
    primary_label: reference_primary_label

output:
  write_parquet: true
  write_csv: true
  runs_directory: runs
