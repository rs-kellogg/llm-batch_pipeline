version: 1

project:
  name: job-managerial-classifier
  description: Classify job postings as managerial vs non-managerial using a local Ollama server.

input:
  path: data/synthetic_jobs.parquet
  format: auto
  id_column: null
  fields_sent:
    jobtitle_translated: jobtitle_translated
    description: description
  required_fields: []
  missing_required: error

task:
  rows_per_request: 1
  output_schema: schema.json
  max_output_tokens: 300

prompt:
  version: "1.0"
  system_file: prompts/system.txt
  user_file: prompts/user.txt

providers:
  openai_compatible:
    model: qwen3.5:9b
    base_url: http://qgpu0202:9723/v1
    sync_input_price_per_million: 0
    sync_output_price_per_million: 0
    options:
      reasoning_effort: none

budget:
  max_estimated_usd: 1.0
